name: Publish personal research build
# Owner authorized consolidating the personal PRs and publishing from main.
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: personal-pages
  cancel-in-progress: false
jobs:
  build:
    # Publish only the personal main commit after numerical and browser gates.
    if: >-
      github.repository == 'zhengw88/forever-mage-lab' &&
      github.actor == 'zhengw88' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python lab.py validate
      - run: git diff --exit-code -- index.html leveling.html sim-data.json current-experiments.json provisional-rankings.json PROVISIONAL-RANKING.md
      - run: python build_personal_site.py
      - run: python -m pip install playwright==1.51.0
      - run: python -m playwright install --with-deps chromium
      - run: python tests/current_page_check.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy personal artifact
        id: deployment
        uses: actions/deploy-pages@v4
