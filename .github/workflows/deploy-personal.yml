name: Publish personal research build
on:
  workflow_dispatch:
  push:
    branches: [maintenance/rebuild-foundation-2026-11-02]
    paths: [.github/workflows/deploy-personal.yml]
permissions:
  contents: read
concurrency:
  group: personal-pages
  cancel-in-progress: false
jobs:
  build:
    # A normal maintenance commit never publishes. The bootstrap marker is used
    # only for the owner's explicit deployment request; later runs are manual.
    if: >-
      github.repository == 'zhengw88/forever-mage-lab' &&
      github.actor == 'zhengw88' &&
      (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[publish-personal]'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python lab.py validate
      - run: git diff --exit-code -- index.html sim-data.json current-experiments.json
      - run: python build_personal_site.py
      - run: python -m pip install playwright==1.51.0
      - run: python -m playwright install --with-deps chromium
      - run: python tests/current_page_check.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy personal artifact
        id: deployment
        uses: actions/deploy-pages@v4
